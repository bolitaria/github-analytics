name: PR Quality & CI Checks

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint (black, isort, flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8
      - name: Run black
        run: black --check src/ tests/
      - name: Run isort
        run: isort --check-only src/ tests/
      - name: Run flake8
        run: flake8 src/ tests/ --max-line-length=120

  unit-tests:
    name: Unit tests (5 attempts)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        repeat: [1, 2, 3, 4, 5]
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:23.8
        ports:
          - 8123:8123      # HTTP para health check
          - 9001:9000      # Puerto nativo (mapeado al 9001 que espera tu código)
        options: >-
          --health-cmd "wget --spider --quiet http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Wait for ClickHouse HTTP
        run: |
          for i in {1..30}; do
            if wget --spider --quiet http://localhost:8123/ping; then
              echo "ClickHouse is ready"
              break
            fi
            echo "Waiting for ClickHouse... (attempt $i)"
            sleep 2
          done
      - name: Initialize ClickHouse tables
        run: python scripts/init_clickhouse.py
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 9001
      - name: Initialize admin user
        run: python scripts/init_users.py
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 9001
      - name: Run unit tests (attempt ${{ matrix.repeat }})
        id: test
        continue-on-error: true
        run: pytest tests/ -v --maxfail=1 --tb=short --ignore=tests/integration --ignore=tests/test_etl.py
      - name: Record attempt result
        run: echo "attempt=${{ matrix.repeat }} status=${{ steps.test.outcome }}" >> flaky_attempts.txt
      - name: Upload flaky attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-attempts-${{ github.run_id }}
          path: flaky_attempts.txt

  integration-matrix:
    name: Integration tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        db: [clickhouse, postgres, mysql]
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:23.8
        ports: ['8123:8123', '9001:9000']
        options: >-
          --health-cmd "wget --spider --quiet http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: github_analytics
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: github_analytics
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_USER: admin
          MYSQL_PASSWORD: admin123
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot123"
          --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Wait for ClickHouse (if needed)
        if: matrix.db == 'clickhouse'
        run: |
          for i in {1..30}; do
            if wget --spider --quiet http://localhost:8123/ping; then
              echo "ClickHouse is ready"
              break
            fi
            echo "Waiting for ClickHouse... (attempt $i)"
            sleep 2
          done
      - name: Initialize ClickHouse tables (if needed)
        if: matrix.db == 'clickhouse'
        run: python scripts/init_clickhouse.py
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 9001
      - name: Initialize admin user (if needed)
        if: matrix.db == 'clickhouse'
        run: python scripts/init_users.py
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 9001
      - name: Run integration tests for ${{ matrix.db }}
        run: |
          pytest tests/integration -v -k "${{ matrix.db }}" || echo "No integration tests for ${{ matrix.db }} yet"
        env:
          TEST_DB: ${{ matrix.db }}
          CLICKHOUSE_PORT: 9001

  security:
    name: Security scan (Safety, Bandit, Trivy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Safety
        run: pip install safety
      - name: Check dependencies
        run: safety check --full-report
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit SAST
        run: bandit -r src/ -ll -f json -o bandit_report.json || true
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  flaky-detection:
    name: Detect flaky tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download flaky attempts
        uses: actions/download-artifact@v4
        with:
          name: flaky-attempts-${{ github.run_id }}
          path: ./
        continue-on-error: true
      - name: Analyze results
        id: analyze
        run: |
          if [ -f flaky_attempts.txt ]; then
            failures=$(grep -c "status=failure" flaky_attempts.txt || true)
            echo "failures=$failures" >> $GITHUB_OUTPUT
            if [ $failures -gt 0 ] && [ $failures -lt 5 ]; then
              echo "flaky=True" >> $GITHUB_OUTPUT
            else
              echo "flaky=False" >> $GITHUB_OUTPUT
            fi
          else
            echo "flaky=False" >> $GITHUB_OUTPUT
          fi
      - name: Comment PR about flaky tests
        if: steps.analyze.outputs.flaky == 'True'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Potential flaky tests detected**\n\nUnit tests failed in ${{ steps.analyze.outputs.failures }} out of 5 runs. Please review the test suite for nondeterministic behaviour.'
            })

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-matrix, security, flaky-detection]
    if: always()
    steps:
      - name: Check if Slack webhook is configured
        id: check_slack
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          fi
      - name: Send notification
        if: steps.check_slack.outputs.skip != 'true'
        uses: slackapi/slack-github-action@v1.25
        with:
          payload: |
            {
              "text": "PR #${{ github.event.number }} CI status: ${{ job.status }}\nRepo: ${{ github.repository }}\nCommit: ${{ github.sha }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}