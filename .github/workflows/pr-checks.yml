name: PR Quality & CI Checks

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install linting tools
        run: pip install black isort flake8
      - name: Run black
        run: black --check src/ tests/
      - name: Run isort
        run: isort --check-only src/ tests/
      - name: Run flake8
        run: flake8 src/ tests/ --max-line-length=120

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        repeat: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests (attempt ${{ matrix.repeat }})
        id: test
        continue-on-error: true
        run: pytest tests/unit -v --maxfail=1 --tb=short
      - name: Record attempt result
        run: echo "attempt=${{ matrix.repeat }} status=${{ steps.test.outcome }}" >> flaky_attempts.txt
      - name: Upload flaky attempts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-attempts-${{ github.run_id }}
          path: flaky_attempts.txt

  integration-tests-matrix:
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        db: [clickhouse, postgres, mysql]
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports: ['9000:9000']
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 10s
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: github_analytics
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: github_analytics
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_USER: admin
          MYSQL_PASSWORD: admin123
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run integration tests for ${{ matrix.db }}
        run: |
          pytest tests/integration -v -k "${{ matrix.db }}" || echo "Integration tests not fully implemented yet"
        env:
          TEST_DB: ${{ matrix.db }}

  security-scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Safety
        run: pip install safety
      - name: Check dependencies for vulnerabilities
        run: safety check --full-report
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit (SAST)
        run: bandit -r src/ -ll
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  flaky-test-detection:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download flaky attempts
        uses: actions/download-artifact@v4
        with:
          name: flaky-attempts-${{ github.run_id }}
          path: ./
        continue-on-error: true
      - name: Analyze flaky patterns
        id: flaky
        run: |
          if [ -f flaky_attempts.txt ]; then
            failures=$(grep -c "status=failure" flaky_attempts.txt || true)
            echo "failures=$failures" >> $GITHUB_OUTPUT
            if [ $failures -gt 0 ] && [ $failures -lt 5 ]; then
              echo "flaky=True" >> $GITHUB_OUTPUT
            else
              echo "flaky=False" >> $GITHUB_OUTPUT
            fi
          else
            echo "flaky=False" >> $GITHUB_OUTPUT
            echo "No flaky attempts file found"
          fi
      - name: Comment PR about flaky tests
        if: steps.flaky.outputs.flaky == 'True'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Flaky tests detected**\n\nUnit tests failed in ${{ steps.flaky.outputs.failures }} out of 5 runs. Please review the test suite for nondeterministic behavior.'
            })

  notify-slack:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests-matrix, security-scan, flaky-test-detection]
    if: always() && secrets.SLACK_WEBHOOK_URL != ''
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.25
        with:
          payload: |
            {
              "text": "PR #${{ github.event.number }} CI status: ${{ job.status }}\nRepo: ${{ github.repository }}\nCommit: ${{ github.sha }}\nView details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}