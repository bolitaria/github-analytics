name: PR Quality & CI Checks

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # para ejecución manual

env:
  PYTHON_VERSION: '3.12'
  CLICKHOUSE_HOST: localhost
  CLICKHOUSE_PORT: 9000
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  MYSQL_HOST: localhost
  MYSQL_PORT: 3306

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install flake8 black isort
          pip install -r requirements.txt
      - name: Run black
        run: black --check src/ tests/
      - name: Run isort
        run: isort --check-only src/ tests/
      - name: Run flake8
        run: flake8 src/ tests/ --max-line-length=120

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        repeat: [1,2,3,4,5]   # ejecutar 5 veces para detectar flaky tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests (attempt ${{ matrix.repeat }})
        run: pytest tests/unit -v --maxfail=1 --tb=short
      - name: Store result for flaky detection
        if: always()
        run: echo "attempt=${{ matrix.repeat }} status=${{ job.status }}" >> flaky_attempts.txt
      - name: Upload flaky attempts artifact
        uses: actions/upload-artifact@v4
        with:
          name: flaky-attempts-${{ github.run_id }}
          path: flaky_attempts.txt

  integration-tests-matrix:
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        db:
          - clickhouse
          - postgres
          - mysql
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports: ['9000:9000']
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 10s
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: github_analytics
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: github_analytics
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_USER: admin
          MYSQL_PASSWORD: admin123
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run integration tests for ${{ matrix.db }}
        run: |
          pytest tests/integration -v -k "${{ matrix.db }}"
        env:
          TEST_DB: ${{ matrix.db }}

  security-scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Safety
        run: pip install safety
      - name: Check dependencies for vulnerabilities
        run: safety check --full-report
      - name: Run Bandit (SAST)
        run: pip install bandit && bandit -r src/ -ll
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  flaky-test-detection:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download flaky attempts artifacts
        uses: actions/download-artifact@v4
        with:
          name: flaky-attempts-${{ github.run_id }}
      - name: Analyze flaky patterns
        id: flaky
        run: |
          # Simulación: contar fallos en los 5 intentos
          failures=$(grep -c "status=failure" flaky_attempts.txt || true)
          echo "failures=$failures" >> $GITHUB_OUTPUT
          if [ $failures -gt 0 ] && [ $failures -lt 5 ]; then
            echo "flaky=True" >> $GITHUB_OUTPUT
          else
            echo "flaky=False" >> $GITHUB_OUTPUT
          fi
      - name: Comment PR about flaky tests
        uses: actions/github-script@v7
        if: steps.flaky.outputs.flaky == 'True'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Flaky tests detected**\n\nUnit tests failed in ${{ steps.flaky.outputs.failures }} out of 5 runs. Please review the test suite for nondeterministic behavior.'
            })

  load-test:
    runs-on: ubuntu-latest
    needs: [integration-tests-matrix]
    if: contains(github.event.pull_request.labels.*.name, 'performance-critical')
    steps:
      - uses: actions/checkout@v4
      - name: Install Locust
        run: pip install locust
      - name: Run load test (simulated)
        run: |
          locust -f tests/load/locustfile.py --headless -u 10 -r 2 --run-time 30s
        continue-on-error: true   # no bloquear el PR, solo informar

  notify-slack:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests-matrix, security-scan, flaky-test-detection]
    if: always()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.25
        with:
          payload: |
            {
              "text": "PR #${{ github.event.number }} CI status: ${{ job.status }}\nRepo: ${{ github.repository }}\nCommit: ${{ github.sha }}\nView details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}