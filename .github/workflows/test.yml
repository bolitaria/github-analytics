name: Quick CI on push

on:
  push:
    branches-ignore: [ main ]
  workflow_dispatch:

jobs:
  quick-tests:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:23.8
        ports: ['8123:8123', '9000:9000']
        options: >-
          --health-cmd "wget --spider --quiet http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (quick)
        run: |
          pip install black isort flake8
          black --check src/ tests/ || true
          isort --check-only src/ tests/ || true
          flake8 src/ tests/ --max-line-length=120 || true
      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/integration
      - name: Run integration tests (ClickHouse only)
        run: pytest tests/integration -v
        env:
          TEST_DB: clickhouse