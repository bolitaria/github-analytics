name: Release Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push app image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app:latest -f Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app:latest
      - name: Build and push ETL image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-etl:latest -f Dockerfile.etl .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-etl:latest

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: http://staging.example.com
    steps:
      - name: Deploy to staging (simulated)
        run: |
          echo "Deploying to staging environment..."
          # Aquí iría ssh, kubectl, etc.

  smoke-test-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Run smoke tests
        run: |
          curl -f http://staging.example.com/api/health || exit 1
          # más pruebas

  wait-approval:
    runs-on: ubuntu-latest
    needs: smoke-test-staging
    environment:
      name: production
    steps:
      - name: Manual approval required
        run: echo "Waiting for approval from release manager"

  deploy-production:
    runs-on: ubuntu-latest
    needs: wait-approval
    steps:
      - name: Deploy to production
        run: echo "Deploying to production..."

  generate-release-report:
    runs-on: ubuntu-latest
    needs: [deploy-production]
    steps:
      - name: Generate release report
        run: |
          echo "# Release Report" > release_report.md
          echo "**Date:** $(date)" >> release_report.md
          echo "**Commit:** ${{ github.sha }}" >> release_report.md
          echo "**Status:** Deployed to production" >> release_report.md
          cat release_report.md
      - name: Upload release report
        uses: actions/upload-artifact@v4
        with:
          name: release-report
          path: release_report.md