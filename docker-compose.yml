networks:
  github_analytics_net:
    driver: bridge

volumes:
  clickhouse_data:
  grafana_data:          # optional
  metabase_db_data:
  metabase_plugins:

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse_github_analytics
    ports:
      - "8124:8123"
      - "9001:9000"
    environment:
      CLICKHOUSE_DB: github_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - github_analytics_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_github_analytics
    ports:
      - "3003:3000"                # changed from 3001 to 3003 (avoid conflict)
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - clickhouse
    networks:
      - github_analytics_net
    restart: unless-stopped

  predictions-api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8003:8000"                # changed from 8000 to 8003 (avoid conflict)
    volumes:
      - .:/app
    depends_on:
      - clickhouse
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DATABASE=github_analytics
    networks:
      - github_analytics_net
    restart: unless-stopped

  # ============================================
  # Optional Metabase BI add‑on (complementary)
  # ============================================
  metabase-db:
    image: postgres:15
    container_name: metabase_db
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: ${POSTGRES_USER:-metabase_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metabase_pass}
    volumes:
      - metabase_db_data:/var/lib/postgresql/data
    networks:
      - github_analytics_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metabase_user} -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - bi
      - prod

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "${METABASE_PORT:-3002}:3000"      # default port 3002
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-metabase_user}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-metabase_pass}
      JAVA_OPTS: -DMB_PLUGINS_DIR=/plugins
    volumes:
      - ./drivers:/plugins
    depends_on:
      metabase-db:
        condition: service_healthy
      clickhouse:
        condition: service_started
    networks:
      - github_analytics_net
    restart: unless-stopped
    profiles:
      - bi
      - prod